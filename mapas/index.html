<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapas para completar · Europa y África</title>
<style>
  :root{
    --ink:#1f2933; --muted:#5b6672; --line:#d9dee3; --bg:#f6f7f8; --card:#fff;
    --sea:#d3e8f3; --ctx:#e7e5df; --land:#fff9ea; --border:#8b8168;

  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  header{padding:10px 12px 8px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  h1{font-size:1rem;margin:0;font-weight:700;flex:1 1 auto;white-space:nowrap}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--muted);min-height:36px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:4px;background:var(--line)}
  .bar i{display:block;height:100%;width:0;background:#4caf50;transition:width .3s}
  #panel{background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;min-height:74px;display:flex;gap:12px;align-items:center}
  #panel .emoji{font-size:2.4rem;line-height:1;flex:none;width:3rem;text-align:center}
  #panel .body{flex:1;min-width:0}
  #panel p{margin:0;font-size:.95rem;line-height:1.35}
  #panel .small{color:var(--muted);font-size:.85rem}
  #panel .big{font-size:1.15rem;font-weight:700}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  input[type=text]{font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;flex:1 1 140px;min-width:0;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:.9rem;font-weight:600;min-height:40px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:focus-visible,.seg button:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .msg-ok{color:#1b7a2f;font-weight:600}.msg-bad{color:#b3261e;font-weight:600}.msg-warn{color:#9a5b00;font-weight:600}
  main{flex:1;position:relative;min-height:0;background:var(--sea)}
  svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
  .ctx{fill:var(--ctx);stroke:#cfccc3;stroke-width:.5;vector-effect:non-scaling-stroke}
  .c{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
  .c.sel{fill:var(--sel)} .c.ok{fill:var(--ok)} .c.help{fill:var(--help)}
  .c.ok.sel,.c.help.sel{stroke:#111;stroke-width:2}
  .c.sel{stroke:#111;stroke-width:1.6}
  .c.bad{animation:bad .5s} .c.blink{animation:blink .9s 3}
  @keyframes bad{0%,100%{}30%,70%{fill:var(--bad)}}
  @keyframes blink{50%{fill:var(--sel)}}
  .em{pointer-events:none;text-anchor:middle;dominant-baseline:central}
  .zoom{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  .zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.2rem;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .legend{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-radius:8px;padding:5px 8px;font-size:.72rem;color:var(--muted);display:flex;gap:10px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border)}
  .legend .l1::before{background:var(--ok)} .legend .l2::before{background:var(--help)}
  @media (prefers-reduced-motion:reduce){.c.bad,.c.blink{animation:none}.bar i{transition:none}}
  @media (min-width:720px){h1{font-size:1.15rem}#panel{padding:12px 20px}header{padding:12px 20px}}
</style>
</head>

<header>
  <h1>🗺️ Mapas para completar</h1>
  <div class="seg" role="group" aria-label="Mapa">

  </div>
  <div class="seg" role="group" aria-label="Modo">
    <button data-mode="repasar">Repasar</button><button data-mode="escribir">Escribir</button><button data-mode="ubicar">Ubicar</button>
  </div>
  <span class="progress" id="progress" aria-live="polite"></span>
</header>
<div class="bar"><i id="bar"></i></div>
<section id="panel" aria-live="polite"></section>
<main>
  <svg id="svg" role="img" aria-label="Mapa"></svg>
  <div class="legend"><span class="l1">Solo</span><span class="l2">Con ayuda</span></div>
  <div class="zoom">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="zreset" aria-label="Ver todo el mapa">⤢</button>
  </div>
</main>

const ptrs=new Map();let moved=false,downI=null,pinch=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;const t=e.target.closest('[data-i]');downI=t?+t.dataset.i:null}
  else{moved=true;const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){if(!moved&&Math.hypot(dx,dy)<7)return;moved=true;
    const k=1/svg.getScreenCTM().a;
    vb.x-=dx*k;vb.y-=dy*k;clampVB();setVB();p.x=e.clientX;p.y=e.clientY}
  else if(ptrs.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch>0&&d>0)zoomAt(pinch/d,(a.x+b.x)/2,(a.y+b.y)/2);pinch=d}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(e.type==='pointerup'&&!moved&&downI!=null&&ptrs.size===0)tap(downI)};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
$('#zin').onclick=()=>zoomAt(1/1.6);$('#zout').onclick=()=>zoomAt(1.6);$('#zreset').onclick=resetView;

document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{mapKey=b.dataset.map;store.map=mapKey;save();drawMap();start()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.mode=mode;save();start()});
drawMap();start();
</script>
</body>
</html>
