<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f2ff;
        --card-bg: #ffffff;
        --border: #e8e2fb;
        --text: #1f1533;
        --text-muted: #8a7fa8;
        --violet: #7c3aed;
        --violet-dark: #5b21b6;
        --pink: #ec4899;
        --danger: #e0356b;
        --chip-visual: #ede9fe;
        --chip-visual-text: #6d28d9;
        --chip-funcional: #ffe4e0;
        --chip-funcional-text: #c0245a;
        --chip-menor: #e0f2fe;
        --chip-menor-text: #0369a1;
        --gradient: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1a1425;
          --card-bg: #241c33;
          --border: #382c4d;
          --text: #f1ecff;
          --text-muted: #a898c9;
          --chip-visual: #3b2a63;
          --chip-visual-text: #d8c8ff;
          --chip-funcional: #4a2233;
          --chip-funcional-text: #ffb4cd;
          --chip-menor: #1e3a4a;
          --chip-menor-text: #a3dcff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        color: var(--text);
        background: var(--bg);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .logo {
        width: 30px;
        height: 30px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: var(--gradient);
        box-shadow: 0 4px 10px -2px rgba(124, 58, 237, 0.5);
      }

      .logo svg {
        width: 16px;
        height: 16px;
      }

      h2 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }

      p.subtitle {
        margin: 1px 0 0;
        font-size: 11px;
        color: var(--text-muted);
      }

      section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 2px 10px -4px rgba(93, 47, 191, 0.12);
      }

      section h3 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text);
        margin: 0 0 10px;
      }

      section h3 .step {
        width: 18px;
        height: 18px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--gradient);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
      }

      button,
      .file-btn {
        display: block;
        width: 100%;
        padding: 9px;
        border-radius: 10px;
        border: none;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
      }

      button:not(.secondary) {
        background: var(--violet);
        color: #fff;
        box-shadow: 0 4px 12px -3px rgba(124, 58, 237, 0.5);
      }

      button:disabled {
        background: var(--border);
        color: var(--text-muted);
        box-shadow: none;
        cursor: not-allowed;
      }

      button.secondary,
      .file-btn {
        background: var(--card-bg);
        color: var(--violet);
        border: 1.5px solid var(--violet);
      }

      button.secondary:disabled {
        background: var(--border);
        color: var(--text-muted);
        border-color: var(--border);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .status {
        margin-top: 8px;
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status.error {
        color: var(--danger);
      }

      .spinner {
        width: 10px;
        height: 10px;
        flex: none;
        border: 2px solid var(--border);
        border-top-color: var(--violet);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .preview-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .preview {
        flex: 1;
        min-width: 0;
      }

      .preview img {
        width: 100%;
        display: block;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 12px 12px;
      }

      .preview span {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        color: var(--text-muted);
        word-break: break-all;
      }

      textarea#resultOutput {
        width: 100%;
        min-height: 140px;
        resize: vertical;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="9.5" rx="6" ry="7.5"></ellipse>
          <line x1="12" y1="17" x2="12" y2="21"></line>
          <line x1="9" y1="21" x2="15" y2="21"></line>
        </svg>
      </div>
      <div>
        <h2>Design Compare</h2>
        <p class="subtitle">Comparar diseño vs. implementación real</p>
      </div>
    </header>

    <section>
      <h3><span class="step">1</span>Diseño original</h3>
      <div id="exportStatus" class="status">
        <span id="exportSpinner" class="spinner" hidden></span>
        <span id="exportStatusText">Seleccioná un frame o componente en el canvas y se exporta automáticamente.</span>
      </div>
      <div class="preview-row" id="designPreviewRow" style="display: none">
        <div class="preview">
          <img id="designPreview" alt="Preview del diseño exportado" />
          <span id="designPreviewLabel"></span>
        </div>
      </div>
    </section>

    <section>
      <h3><span class="step">2</span>Diseño implementado</h3>
      <label for="implementationInput" class="file-btn">Seleccionar archivo</label>
      <input
        type="file"
        id="implementationInput"
        accept="image/png, image/jpeg"
        class="visually-hidden"
      />
      <div id="implFileName" class="status">Formatos aceptados: PNG o JPG. Ningún archivo seleccionado.</div>
      <div class="preview-row" id="implPreviewRow" style="display: none">
        <div class="preview">
          <img id="implPreview" alt="Preview de la captura subida" />
          <span id="implPreviewLabel"></span>
        </div>
      </div>
    </section>

    <section>
      <h3><span class="step">3</span>Comparar</h3>
      <button id="compareBtn" disabled>Comparar con backend</button>
      <div id="compareStatus" class="status">
        <span id="compareSpinner" class="spinner" hidden></span>
        <span id="compareStatusText"></span>
      </div>
      <div id="resultBlock" style="display: none">
        <textarea id="resultOutput" readonly></textarea>
        <div style="margin-top: 8px">
          <button id="copyBtn" class="secondary">Copiar resultado</button>
        </div>
      </div>
    </section>

    <script>
      const state = {
        design: null, // { base64, fileName, width, height }
        implementation: null, // { base64, fileName }
      };

      const exportStatus = document.getElementById("exportStatus");
      const exportSpinner = document.getElementById("exportSpinner");
      const exportStatusText = document.getElementById("exportStatusText");
      const designPreviewRow = document.getElementById("designPreviewRow");
      const designPreview = document.getElementById("designPreview");
      const designPreviewLabel = document.getElementById("designPreviewLabel");

      const implementationInput = document.getElementById("implementationInput");
      const implFileName = document.getElementById("implFileName");
      const implPreviewRow = document.getElementById("implPreviewRow");
      const implPreview = document.getElementById("implPreview");
      const implPreviewLabel = document.getElementById("implPreviewLabel");

      const compareBtn = document.getElementById("compareBtn");
      const compareSpinner = document.getElementById("compareSpinner");
      const compareStatusText = document.getElementById("compareStatusText");
      const compareStatus = document.getElementById("compareStatus");
      const resultBlock = document.getElementById("resultBlock");
      const resultOutput = document.getElementById("resultOutput");
      const copyBtn = document.getElementById("copyBtn");

      function updateCompareAvailability() {
        compareBtn.disabled = !(state.design && state.implementation);
      }

      // --- 1. Exportar selección desde Figma (automático) ---

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "selection-changed") {
          exportStatus.classList.remove("error");
          exportSpinner.hidden = !msg.hasValidSelection;
          exportStatusText.textContent = msg.hasValidSelection
            ? `Exportando "${msg.nodeName}"...`
            : "Seleccioná un frame o componente en el canvas y se exporta automáticamente.";
        }

        if (msg.type === "export-success") {
          state.design = {
            base64: msg.base64,
            fileName: msg.fileName,
            width: msg.width,
            height: msg.height,
          };
          exportSpinner.hidden = true;
          exportStatusText.textContent = `Exportado: "${msg.fileName}"`;
          designPreview.src = `data:image/png;base64,${msg.base64}`;
          designPreviewLabel.textContent = `${msg.fileName}${
            msg.width && msg.height ? ` · ${msg.width}×${msg.height}` : ""
          }`;
          designPreviewRow.style.display = "flex";
          updateCompareAvailability();
        }

        if (msg.type === "export-error") {
          exportSpinner.hidden = true;
          exportStatusText.textContent = msg.message;
          exportStatus.classList.add("error");
        }
      };

      // --- 2. Subir captura local ---

      implementationInput.addEventListener("change", () => {
        const file = implementationInput.files && implementationInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(",")[1];

          state.implementation = { base64, fileName: file.name, mimeType: file.type };
          implFileName.textContent = `Seleccionado: "${file.name}"`;
          implPreview.src = dataUrl;
          implPreviewLabel.textContent = file.name;
          implPreviewRow.style.display = "flex";
          updateCompareAvailability();
        };
        reader.readAsDataURL(file);
      });

      // --- 3. Comparar ---

      const BACKEND_URL = "https://designrebels.onrender.com/compare";

      async function compareWithBackend(design, implementation) {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            originalImage: design.base64,
            implementedImage: implementation.base64,
          }),
        });

        if (!response.ok) {
          const errorBody = await response.json().catch(() => null);
          throw new Error(
            errorBody?.message || errorBody?.error || `Backend respondió ${response.status}`
          );
        }

        return response.json(); // { diffs: [{ description, location, type }, ...] }
      }

      function formatDiffsAsPlainText(result) {
        if (!result.diffs || result.diffs.length === 0) {
          return "Sin diferencias detectadas.";
        }

        return result.diffs
          .map(
            (diff, i) =>
              `${i + 1}. [${diff.type}] ${diff.description}\n   Ubicación: ${diff.location}`
          )
          .join("\n\n");
      }

      compareBtn.addEventListener("click", async () => {
        if (!state.design || !state.implementation) return;

        compareBtn.disabled = true;
        resultBlock.style.display = "none";
        compareStatus.classList.remove("error");
        compareSpinner.hidden = false;
        compareStatusText.textContent = "Comparando con el backend... (puede tardar ~30s si estaba inactivo)";
        resultOutput.value = "";

        try {
          const result = await compareWithBackend(state.design, state.implementation);
          resultOutput.value = formatDiffsAsPlainText(result);
          compareStatusText.textContent = `${result.diffs.length} diferencia(s) encontrada(s).`;
          resultBlock.style.display = "block";
        } catch (error) {
          compareStatusText.textContent = `Error: ${error.message}`;
          compareStatus.classList.add("error");
        } finally {
          compareSpinner.hidden = true;
          updateCompareAvailability();
        }
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(resultOutput.value);
          copyBtn.textContent = "Copiado ✓";
          setTimeout(() => (copyBtn.textContent = "Copiar resultado"), 1500);
        } catch (error) {
          resultOutput.select();
          document.execCommand("copy");
        }
      });
    </script>
  </body>
</html>
