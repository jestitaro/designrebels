<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votá el nuevo logo de PSMob · QuartzSales</title>
<meta name="description" content="Tres propuestas para el nuevo logo de PSMob. Miralas en la app y votá tu favorita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1840; --dark:#130D5D; --navy:#140E52; --muted:#5f6380; --line:rgba(27,24,64,.12);
    --accent:#4338CA; --accent-soft:#e3e1fb; --blue:#0260FD;
    --grad:linear-gradient(135deg,#3C9FF1 0%,#1D4ED8 32%,#7025E0 80%);
    --card:#fff; --bar:64px;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:linear-gradient(135deg,#eef0f7 0%,#e9e8f8 45%,#e2dffb 100%) fixed}
  img{display:block;max-width:100%}
  button{font:inherit;cursor:pointer;color:inherit}
  :focus-visible{outline:3px solid #8b85f0;outline-offset:3px;border-radius:10px}
  #app:focus,#app:focus-visible{outline:none}

  /* Barra de progreso + encabezado */
  .progress{position:fixed;inset:0 0 auto 0;height:4px;background:rgba(67,56,202,.12);z-index:20}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:var(--dark);letter-spacing:-.01em}
  .brand img{height:26px;width:auto}

  .stage{width:min(880px,100% - 40px);margin:0 auto;padding:36px 0 calc(var(--bar) + 60px)}
  .stage.narrow{width:min(760px,100% - 40px)}
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Portada */
  .intro{position:relative;padding-top:20px}
  .pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(67,56,202,.25);padding:8px 16px;border-radius:999px}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .intro h1{font-size:clamp(44px,7.4vw,84px);line-height:1.02;letter-spacing:-.03em;font-weight:800;color:var(--ink);margin:26px 0 22px;max-width:13ch}
  .intro .lead{font-size:clamp(17px,2vw,20px);line-height:1.55;color:var(--muted);max-width:46ch;margin:0 0 30px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:760px;margin-bottom:32px}
  .stats div{padding:22px 24px}
  .stats div+div{border-left:1px solid var(--line)}
  .stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .stats span{font-size:15px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .fine{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .ghost-word{position:fixed;right:-2vw;bottom:-6vw;font-size:clamp(160px,26vw,380px);font-weight:900;letter-spacing:-.04em;line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(67,56,202,.10);pointer-events:none;z-index:-1;user-select:none}

  /* Botones */
  .btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:16px 26px;font-weight:800;font-size:17px;color:#fff;background:var(--accent);box-shadow:0 10px 24px -14px rgba(67,56,202,.9);transition:transform .15s ease,background .15s ease}
  .btn:hover{background:#3a30b4;transform:translateY(-1px)}
  .btn[disabled]{background:#b9b6dd;box-shadow:none;cursor:not-allowed;transform:none}
  .btn.line{background:transparent;color:var(--ink);border:1px solid rgba(27,24,64,.25);box-shadow:none}
  .btn.line:hover{background:rgba(255,255,255,.6)}
  .link{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;padding:10px 6px}
  .link:hover{color:var(--ink)}

  /* Paso de opción */
  .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:800;font-size:15px;line-height:1.35;margin-bottom:18px;background:var(--accent-soft);padding:8px 14px;border-radius:12px}
  .step-title{display:flex;align-items:center;gap:14px;margin:0 0 6px}
  .step-title img{height:40px;width:auto}
  .step-title h2{font-size:clamp(32px,4.4vw,44px);font-weight:800;letter-spacing:-.02em;margin:0;color:var(--ink)}
  .step-sub{color:var(--muted);font-size:17px;margin:0 0 22px}
  .chips-label{font-size:13px;font-weight:800;color:var(--accent);margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  .chip{border:0;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(27,24,64,.06);transition:background .15s ease,color .15s ease}
  .chip small{font-size:12px;font-weight:800;opacity:.75}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}

  .media{background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 50px -34px rgba(27,24,64,.5)}
  .phones{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .phone{margin:0}
  .screen{position:relative;aspect-ratio:360/800;border-radius:22px;overflow:hidden;background:#0b0f1a;border:5px solid #11132a}
  .screen>img{width:100%;height:100%;object-fit:cover}
  .launcher-icon{position:absolute;left:7.22%;top:57%;width:13.4%;aspect-ratio:1;border-radius:30%;background:#fff;display:flex;align-items:center;justify-content:center}
  .launcher-icon img{width:74%}
  .phone figcaption{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin-top:10px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .tile{border-radius:18px;min-height:170px;display:flex;align-items:center;justify-content:center;padding:34px 22px 22px;position:relative}
  .tile .tag{position:absolute;top:12px;left:16px;font-size:13px;font-weight:700;opacity:.6}
  .tile.light{background:#f3f2fb}
  .tile.dark{background:var(--dark);color:#fff}
  .tile.sizes{justify-content:flex-start;align-items:flex-end;gap:clamp(12px,2vw,22px);flex-wrap:wrap;min-height:0}
  .sz{display:flex;flex-direction:column;align-items:center;gap:7px}
  .sz small{font:500 11px Roboto,sans-serif;opacity:.55}
  .appicon{background:#fff;border-radius:28%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(19,13,93,.18)}
  .appicon img{width:74%}

  .lockup{display:flex;align-items:center;gap:.22em;font-size:clamp(30px,4.2vw,46px)}
  .lockup img{height:1.42em;width:auto}
  .wm{font-weight:900;letter-spacing:-.01em;line-height:1;color:var(--navy)}
  .wm b{font-weight:900}
  .pal-qs .wm b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pal-ps .wm b{color:var(--blue)}
  .dark .wm,.dark .wm b{color:#fff!important;background:none!important;-webkit-text-fill-color:#fff}

  /* Elegir */
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
  .choice{border:2px solid transparent;background:#fff;border-radius:20px;padding:26px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 30px -24px rgba(27,24,64,.6);transition:border-color .15s ease,transform .15s ease}
  .choice:hover{transform:translateY(-2px)}
  .choice img{height:76px;width:auto}
  .choice b{font-size:18px;font-weight:800}
  .choice span{font-size:14px;color:var(--muted);margin-top:-10px}
  .choice[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 4px rgba(67,56,202,.15)}
  .preview{background:#fff;border-radius:20px;padding:28px;display:flex;justify-content:center}

  /* Resultados */
  .bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:20px;align-items:center;margin-bottom:18px}
  .bar-row .lbl{display:flex;align-items:center;gap:10px;font-weight:800}
  .bar-row .lbl img{height:28px;width:auto}
  .bar{height:34px;background:#efeefa;border-radius:10px;overflow:hidden;display:flex}
  .bar i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .bar i.qs{background:var(--grad)} .bar i.ps{background:var(--blue)}
  .bar-row .num{text-align:right;font-weight:900;font-size:20px}
  .bar-row .num small{display:block;font:500 12px Roboto,sans-serif;color:var(--muted)}
  .legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .results-card{background:#fff;border-radius:22px;padding:32px 32px 28px;margin-top:8px}
  .results-card .chips-label{margin-bottom:22px;font-size:14px}
  .done-mark{width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:12px 0 22px}
  .err{background:#fff1f2;color:#be123c;border-radius:14px;padding:12px 16px;font-weight:700;margin-bottom:18px}

  /* Barra inferior */
  .bottom{position:fixed;inset:auto 0 0 0;height:var(--bar);padding:0 20px;background:rgba(244,243,252,.85);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:10}
  .bottom .in{width:min(500px,100%);display:flex;justify-content:space-between;align-items:center}
  .bottom .btn{padding:12px 22px;font-size:16px}
  .bottom[hidden]{display:none}

  dialog{border:0;border-radius:24px;padding:0;width:min(440px,92vw);box-shadow:0 30px 80px -20px rgba(19,13,93,.5)}
  dialog::backdrop{background:rgba(27,24,64,.45);backdrop-filter:blur(3px)}
  .dlg{padding:30px}
  .dlg h2{margin:0 0 8px;font-size:24px;font-weight:800;color:var(--ink)}
  .dlg p{margin:0 0 22px;color:var(--muted);line-height:1.5}
  .dlg .preview{background:#f3f2fb;margin-bottom:22px}
  .dlg .preview .lockup{font-size:38px}
  .dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

  @media (max-width:760px){
    .stats div{padding:16px 14px}
    .stats b{font-size:24px}
    .stats span{font-size:13px}
    .tiles{grid-template-columns:1fr}
    .phones{grid-auto-flow:column;grid-auto-columns:64%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
    .phone{scroll-snap-align:start}
    .media{padding:14px;border-radius:18px}
    .choices{grid-template-columns:1fr;gap:10px}
    .choice{flex-direction:row;padding:16px 18px;gap:16px}
    .choice img{height:44px}
    .choice span{margin:0 0 0 auto}
    .bar-row{grid-template-columns:44px 1fr 54px;gap:10px}
    .results-card{padding:22px 18px 20px}
    .bar-row .lbl span{display:none}
    .intro .actions .btn{width:100%;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="prog" style="width:0"></i></div>
<header class="top">
  <div class="brand">QuartzSales</div>
</header>
<div class="ghost-word" aria-hidden="true">PSMob</div>

<main id="app" class="stage" tabindex="-1"></main>

<nav class="bottom" id="bottom" hidden>
  <div class="in">
    <button class="link" type="button" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Volver</button>
    <button class="btn" type="button" id="next">Continuar</button>
  </div>
</nav>

<dialog id="confirm" aria-labelledby="dlg-title">
  <div class="dlg">
    <h2 id="dlg-title">¿Es tu elegida?</h2>
    <p id="dlg-text"></p>
    <div class="preview" id="dlg-preview"></div>
    <div class="row">
      <button class="btn line" type="button" data-close>Mejor sigo mirando</button>
      <button class="btn" type="button" id="dlg-ok">Sí, es esta</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  // En Vercel todo es relativo; desde GitHub Pages se usa la API de Vercel.
  const VERCEL_ORIGIN = 'https://psmob-logo-vote.vercel.app';
  const onVercel = /vercel\.app$/.test(location.hostname);
  const API = onVercel ? '/api' : VERCEL_ORIGIN + '/api';
  const ASSETS = onVercel ? 'https://jestitaro.github.io/designrebels/projects/psmob-logo-vote/assets/' : 'assets/';
  const a = f => ASSETS + f;
  const $ = s => document.querySelector(s);

  const OPTIONS = [
    { id: '1', name: 'Opción 1', desc: 'Pin abierto', good: 'Simple, liviano y fácil de recordar: lo dibujás en una servilleta.' },
    { id: '2', name: 'Opción 2', desc: 'Pin lleno', good: 'Compacto y con presencia: se lee bien incluso en tamaño ícono.' },
    { id: '3', name: 'Opción 3', desc: 'Equipo en movimiento', good: 'Cuenta toda la historia: gente en la calle y resultados que crecen.' },
  ];
  const PAL = { ps: 'paleta PSMob', qs: 'paleta QuartzSales' };
  const opt = id => OPTIONS.find(o => o.id === id);

  // Orden aleatorio estable por visitante, para que la posición no influya.
  let order;
  try { order = JSON.parse(localStorage.getItem('psmob-order')); } catch {}
  if (!Array.isArray(order) || order.length !== 3) {
    order = OPTIONS.map(o => o.id).sort(() => Math.random() - .5);
    try { localStorage.setItem('psmob-order', JSON.stringify(order)); } catch {}
  }

  const STEPS = ['intro', ...order, 'choose', 'results'];
  const state = { step: 0, palette: 'ps', pick: null, mine: null, results: null, error: '' };

  const lockup = (id, pal, dark) =>
    `<div class="lockup pal-${pal}"><img src="${a(dark ? `iso-${id}-white.svg` : `iso-${id}-${pal}.svg`)}" alt=""><span class="wm"><b>PS</b>Mob</span></div>`;

  const chips = () => `
    <p class="chips-label">Paleta de color</p>
    <div class="chips" role="group" aria-label="Paleta de color">
      <button class="chip" type="button" data-pal="ps" aria-pressed="${state.palette === 'ps'}">PSMob <small>principal</small></button>
      <button class="chip" type="button" data-pal="qs" aria-pressed="${state.palette === 'qs'}">QuartzSales</button>
    </div>`;

  const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function viewIntro() {
    return `<section class="intro fade">
      <span class="pill">Votación PSMob</span>
      <h1>Elegí el nuevo logo de PSMob.</h1>
      <p class="lead">¡PSMob cambia de logo y vos decidís! Mirá las 3 opciones, jugá con los colores y votá tu favorita.</p>
      <div class="stats">
        <div><b>3</b><span>opciones finalistas</span></div>
        <div><b>1</b><span>voto por persona</span></div>
        <div><b>100%</b><span>anónimo</span></div>
      </div>
      <div class="actions"><button class="btn" type="button" data-go="1">Empezar ${arrow}</button></div>
      <p class="fine">No guardamos quién vota: solo contamos un voto por conexión. Si estás con la VPN de la empresa, desconectala antes de votar.</p>
    </section>`;
  }

  function viewOption(id) {
    const o = opt(id), pal = state.palette;
    const sizes = dark => [96, 48, 32, 24, 16].map(px =>
      `<div class="sz"><img src="${a(dark ? `iso-${id}-white.svg` : `iso-${id}-${pal}.svg`)}" alt="" style="height:${px}px;width:auto"><small>${px}px</small></div>`).join('');
    const icons = [64, 48].map(px =>
      `<div class="sz"><div class="appicon" style="width:${px}px;height:${px}px"><img src="${a(`iso-${id}-${pal}.svg`)}" alt=""></div><small>ícono ${px}</small></div>`).join('');
    return `<section class="fade">
      <div class="kicker">${spark}Lo bueno: ${o.good}</div>
      <div class="step-title"><img src="${a(`iso-${id}-${pal}.svg`)}" alt=""><h2>${o.name}</h2></div>
      <p class="step-sub">${o.desc}. Así se vería en tu celu.</p>
      ${chips()}
      <div class="media">
        <div class="phones">
          <figure class="phone"><div class="screen"><img src="${a('launcher.webp')}" alt="Pantalla de aplicaciones con el ícono de PSMob">
            <div class="launcher-icon"><img src="${a(`iso-${id}-${pal}.svg`)}" alt=""></div></div><figcaption>Ícono</figcaption></figure>
          <figure class="phone"><div class="screen"><img src="${a(`opt${id}-splash-${pal}.webp`)}" alt="Pantalla de inicio con la ${o.name}"></div><figcaption>Inicio</figcaption></figure>
          <figure class="phone"><div class="screen"><img src="${a(`opt${id}-login-${pal}.webp`)}" alt="Pantalla de ingreso con la ${o.name}"></div><figcaption>Ingreso</figcaption></figure>
        </div>
      </div>
      <div class="tiles">
        <div class="tile light"><span class="tag">Color</span>${lockup(id, pal)}</div>
        <div class="tile dark"><span class="tag">Negativo</span>${lockup(id, pal, true)}</div>
        <div class="tile light sizes"><span class="tag">Chiquito</span>${sizes(false)}${icons}</div>
        <div class="tile dark sizes"><span class="tag">Chiquito y en negativo</span>${sizes(true)}</div>
      </div>
    </section>`;
  }

  function viewChoose() {
    const pal = state.palette;
    return `<section class="fade">
      <div class="kicker">${spark}Llegó el momento de la verdad</div>
      <div class="step-title"><h2>¿Cuál es tu favorita?</h2></div>
      <p class="step-sub">Elegí un logo y la paleta. Votás con la paleta que tengas marcada.</p>
      <div class="choices" role="radiogroup" aria-label="Logo">
        ${order.map(id => `<button class="choice" type="button" role="radio" data-pick="${id}" aria-checked="${state.pick === id}">
          <img src="${a(`iso-${id}-${pal}.svg`)}" alt=""><b>${opt(id).name}</b><span>${opt(id).desc}</span></button>`).join('')}
      </div>
      ${chips()}
      ${state.pick ? `<div class="preview">${lockup(state.pick, pal)}</div>` : ''}
    </section>`;
  }

  function viewResults() {
    const r = state.results;
    if (!r) return `<section class="fade"><p class="step-sub">Cargando resultados…</p></section>`;
    const mine = state.mine ? opt(state.mine.option) : null;
    const rows = OPTIONS.map(o => {
      const d = r.options[o.id]; const p = n => r.total ? n / r.total * 100 : 0;
      return `<div class="bar-row">
        <div class="lbl"><img src="${a(`iso-${o.id}-ps.svg`)}" alt=""><span>${o.name}</span></div>
        <div class="bar" role="img" aria-label="${o.name}: ${d.total} votos"><i class="ps" style="width:${p(d.ps)}%"></i><i class="qs" style="width:${p(d.qs)}%"></i></div>
        <div class="num">${Math.round(p(d.total))}%<small>${d.total} ${d.total === 1 ? 'voto' : 'votos'}</small></div></div>`;
    }).join('');
    return `<section class="fade">
      <div class="done-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="step-title"><h2>¡Ya votaste!</h2></div>
      <p class="step-sub">Tu buen gusto quedó registrado. ¡Gracias!${mine ? ` Elegiste la <strong>${mine.name}</strong> con la <strong>${PAL[state.mine.palette]}</strong>.` : ''}</p>
      <div class="results-card">
        <p class="chips-label">Cómo viene la votación · ${r.total} ${r.total === 1 ? 'voto' : 'votos'}</p>
        ${rows}
        <div class="legend"><span><i style="background:var(--blue)"></i>Paleta PSMob</span><span><i style="background:var(--grad)"></i>Paleta QuartzSales</span></div>
      </div>
      <div class="actions" style="margin-top:28px"><button class="btn line" type="button" data-go="1">Volver a mirar las opciones</button></div>
    </section>`;
  }

  const spark = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 3v4M17 5h4"/></svg>`;

  function render(focus) {
    const key = STEPS[state.step];
    const app = $('#app');
    app.className = 'stage' + (key === 'intro' ? '' : ' narrow');
    app.innerHTML = (state.error ? `<div class="err">${state.error}</div>` : '') +
      (key === 'intro' ? viewIntro() : key === 'choose' ? viewChoose() : key === 'results' ? viewResults() : viewOption(key));
    $('#prog').style.width = (state.step / (STEPS.length - 1) * 100) + '%';

    const bottom = $('#bottom'), next = $('#next');
    bottom.hidden = key === 'intro' || key === 'results';
    if (key === 'choose') {
      next.innerHTML = `Votar ${arrow}`; next.disabled = !state.pick || !!state.mine;
    } else {
      next.innerHTML = `Continuar ${arrow}`; next.disabled = false;
    }
    if (focus) { window.scrollTo({ top: 0 }); app.focus({ preventScroll: true }); }
  }

  function go(i) {
    state.error = '';
    if (STEPS[i] === 'choose' && state.mine) i = STEPS.indexOf('results');
    state.step = Math.max(0, Math.min(STEPS.length - 1, i));
    render(true);
  }

  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return go(+g.dataset.go);
    const p = e.target.closest('[data-pal]'); if (p) { state.palette = p.dataset.pal; return render(); }
    const k = e.target.closest('[data-pick]'); if (k) { state.pick = k.dataset.pick; return render(); }
  });
  $('#back').addEventListener('click', () => go(state.step - 1));
  $('#next').addEventListener('click', () => STEPS[state.step] === 'choose' ? openConfirm() : go(state.step + 1));

  // Confirmación y voto
  const dlg = $('#confirm');
  function openConfirm() {
    if (!state.pick) return;
    $('#dlg-text').innerHTML = `<strong>${opt(state.pick).name}</strong> con la <strong>${PAL[state.palette]}</strong>. Una vez que votás, no hay vuelta atrás.`;
    $('#dlg-preview').innerHTML = lockup(state.pick, state.palette);
    dlg.showModal();
  }
  dlg.addEventListener('click', e => { if (e.target.matches('[data-close]') || e.target === dlg) dlg.close(); });
  $('#dlg-ok').addEventListener('click', async () => {
    const btn = $('#dlg-ok'); btn.disabled = true; btn.textContent = 'Votando…';
    try {
      const r = await fetch(API + '/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ option: state.pick, palette: state.palette }) });
      const data = await r.json();
      dlg.close();
      if (r.ok || r.status === 409) { state.mine = data.mine; state.results = data.results; go(STEPS.indexOf('results')); }
      else throw new Error(data.error || r.status);
    } catch {
      dlg.close(); state.error = 'Algo falló y tu voto no llegó. Probá de nuevo en un ratito.'; render();
    } finally { btn.disabled = false; btn.textContent = 'Sí, es esta'; }
  });

  render();
  fetch(API + '/status').then(r => r.json()).then(d => {
    if (d.voted) { state.mine = d.mine; state.results = d.results; state.pick = d.mine.option; state.palette = d.mine.palette; go(STEPS.indexOf('results')); }
  }).catch(() => {});
})();
</script>
</body>
</html>
